<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabaasa Kaayizenii (Kaizen Dashboard)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen py-8 px-4">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-6 rounded-2xl shadow-sm border gap-4">
      <div>
        <h1 class="text-2xl font-bold text-blue-600">Gabaasa Hordoffi Kaayizenii</h1>
        <p class="text-sm text-gray-500">Google Sheet live view embedded directly</p>
      </div>
      <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSmPYS637CHQ2-quVCCZHQfAWuyzJsPNRyrl2AvIQpz1ZLczXYZjnLgdVgICqje8LoQAM7Ld3QN_TfJ/pubhtml?gid=439812468&single=true" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-xl shadow transition text-sm flex items-center">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
        </svg>
        Guddisee Iliili (Open Full Sheet)
      </a>
    </div>

    <!-- Embedded Google Sheet Card -->
    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden p-2">
      <div class="w-full h-[600px] rounded-xl overflow-hidden border">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSmPYS637CHQ2-quVCCZHQfAWuyzJsPNRyrl2AvIQpz1ZLczXYZjnLgdVgICqje8LoQAM7Ld3QN_TfJ/pubhtml?gid=439812468&amp;single=true&amp;widget=true&amp;headers=false" 
                class="w-full h-full border-0">
        </iframe>
      </div>
    </div>

  </div>

</body>
</html>
